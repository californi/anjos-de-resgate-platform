services:
  postgres:
    image: postgres:16-alpine
    container_name: anjos-de-resgate-postgres
    environment:
      POSTGRES_DB: anjos_de_resgate
      POSTGRES_USER: anjos
      POSTGRES_PASSWORD: anjos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anjos -d anjos_de_resgate"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: anjos-de-resgate-api
    environment:
      DATABASE_URL: postgresql://anjos:anjos@postgres:5432/anjos_de_resgate?schema=public
      CORS_ORIGIN: http://localhost:3000
      PORT: 3333
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3333:3333"
    command: >
      sh -c "pnpm --filter @anjos/api db:push &&
             pnpm --filter @anjos/api db:seed &&
             pnpm --filter @anjos/api start"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3333
    container_name: anjos-de-resgate-web
    environment:
      API_INTERNAL_URL: http://api:3333
      NEXT_PUBLIC_API_URL: http://localhost:3333
      NEXT_PUBLIC_ADMIN_ACCESS_CODE: anjos2026
      PORT: 3000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
