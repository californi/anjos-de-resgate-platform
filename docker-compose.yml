services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: anjos_de_resgate
      POSTGRES_USER: anjos
      POSTGRES_PASSWORD: anjos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anjos -d anjos_de_resgate"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://anjos:anjos@postgres:5432/anjos_de_resgate?schema=public
      CORS_ORIGIN: http://localhost:3000
      PORT: 3333
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_FROM: Plataforma Anjos de Resgate <no-reply@anjos.local>
      CONTACT_TO: contato@anjos.local
      UPLOAD_DIR: /app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "3333:3333"
    volumes:
      - uploads_data:/app/apps/api/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3333/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    command: >
      sh -c "pnpm --filter @anjos/api db:push &&
             pnpm --filter @anjos/api db:seed &&
             pnpm --filter @anjos/api start"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3333
    environment:
      API_INTERNAL_URL: http://api:3333
      NEXT_PUBLIC_API_URL: http://localhost:3333
      NEXT_PUBLIC_ADMIN_ACCESS_CODE: anjos2026
      PORT: 3000
      PIX_KEY: PIX-DEMONSTRACAO
      PIX_RECIPIENT: Anjos de Resgate - ambiente de demonstracao
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  uploads_data:
