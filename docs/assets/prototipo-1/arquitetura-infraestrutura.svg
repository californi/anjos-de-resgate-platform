<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#40566f"/>
    </marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#142033}
      .subtitle{font:400 18px Arial,sans-serif;fill:#52657d}
      .label{font:700 18px Arial,sans-serif;fill:#142033}
      .small{font:400 15px Arial,sans-serif;fill:#40566f}
      .tiny{font:400 13px Arial,sans-serif;fill:#52657d}
      .box{rx:14;ry:14;stroke-width:2}
      .edge{stroke:#40566f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#58744f;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="760" fill="#f7fbf9"/>
  <text x="700" y="50" text-anchor="middle" class="title">Arquitetura e infraestrutura do Prototipo 1</text>
  <text x="700" y="82" text-anchor="middle" class="subtitle">Portal Web/PWA, API NestJS, dominio compartilhado, Prisma/PostgreSQL e Docker Compose</text>

  <rect x="45" y="130" width="1310" height="440" rx="28" ry="28" fill="#ffffff" stroke="#d6e4df" stroke-width="2"/>
  <text x="75" y="168" class="label">Fluxo principal</text>

  <rect x="80" y="230" width="160" height="90" class="box" fill="#e9f4ff" stroke="#5b8cc0"/>
  <text x="160" y="265" text-anchor="middle" class="label">Usuarios</text>
  <text x="160" y="292" text-anchor="middle" class="small">publico e admin</text>

  <rect x="300" y="210" width="205" height="130" class="box" fill="#e7f6f0" stroke="#218767"/>
  <text x="402" y="250" text-anchor="middle" class="label">Web Next.js / PWA</text>
  <text x="402" y="280" text-anchor="middle" class="small">home, sobre, contato</text>
  <text x="402" y="304" text-anchor="middle" class="small">animais e admin</text>

  <rect x="565" y="210" width="205" height="130" class="box" fill="#fff4d8" stroke="#c49022"/>
  <text x="667" y="250" text-anchor="middle" class="label">API NestJS</text>
  <text x="667" y="280" text-anchor="middle" class="small">controllers e DTOs</text>
  <text x="667" y="304" text-anchor="middle" class="small">validacao HTTP</text>

  <rect x="830" y="210" width="205" height="130" class="box" fill="#f0efff" stroke="#7261b6"/>
  <text x="932" y="250" text-anchor="middle" class="label">Aplicacao</text>
  <text x="932" y="280" text-anchor="middle" class="small">AnimalsService</text>
  <text x="932" y="304" text-anchor="middle" class="small">casos de uso</text>

  <rect x="1095" y="210" width="205" height="130" class="box" fill="#fdecec" stroke="#d86a6a"/>
  <text x="1197" y="250" text-anchor="middle" class="label">Dominio</text>
  <text x="1197" y="280" text-anchor="middle" class="small">Animal, enums</text>
  <text x="1197" y="304" text-anchor="middle" class="small">regras basicas</text>

  <path class="edge" d="M240 275 H300"/>
  <path class="edge" d="M505 275 H565"/>
  <path class="edge" d="M770 275 H830"/>
  <path class="edge" d="M1035 275 H1095"/>

  <rect x="570" y="405" width="210" height="105" class="box" fill="#ffffff" stroke="#9db3c8"/>
  <text x="675" y="442" text-anchor="middle" class="label">Repository</text>
  <text x="675" y="470" text-anchor="middle" class="small">contrato + Prisma</text>

  <rect x="840" y="405" width="210" height="105" class="box" fill="#ffffff" stroke="#9db3c8"/>
  <text x="945" y="442" text-anchor="middle" class="label">Banco</text>
  <text x="945" y="470" text-anchor="middle" class="small">PostgreSQL</text>

  <rect x="1110" y="405" width="210" height="105" class="box" fill="#ffffff" stroke="#9db3c8"/>
  <text x="1215" y="442" text-anchor="middle" class="label">Pacotes</text>
  <text x="1215" y="470" text-anchor="middle" class="small">domain, shared, ui</text>

  <path class="edge" d="M675 340 V405"/>
  <path class="edge" d="M780 458 H840"/>
  <path class="dash" d="M1215 405 V340"/>

  <rect x="45" y="610" width="1310" height="90" rx="16" ry="16" fill="#eef5fb" stroke="#b8cbe0" stroke-width="2"/>
  <text x="75" y="645" class="label">Docker Compose</text>
  <text x="75" y="675" class="small">Sobe tres servicos: web :3000, api :3333 e postgres :5432. A API executa db push, seed e start.</text>
  <text x="1035" y="645" class="tiny">Admin simulado: anjos2026</text>
  <text x="1035" y="675" class="tiny">API interna da Web: http://api:3333</text>
</svg>
