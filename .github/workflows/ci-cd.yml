name: CI for public demo

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, build and container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint and type-check
        run: pnpm lint

      - name: Test
        env:
          NODE_ENV: test
        run: pnpm test

      - name: Build applications
        env:
          NEXT_PUBLIC_API_URL: /api
        run: pnpm build

      - name: Build public-demo image
        run: docker build --file Dockerfile.deploy --tag anjos-de-resgate:ci .
